name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python modules
        run: |
          python -m compileall -q app mcp_proxy cullis_sdk cullis_connector

  ruff:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run ruff
        # P2 (review 2026-06-10): ruff was a declared dev-dep that never
        # ran anywhere — it cannot run on every dev machine (NixOS needs
        # nix-shell for libstdc++), so THIS job is the authoritative
        # gate. Config in pyproject.toml [tool.ruff]; baseline cleaned
        # in the same PR that added this job (F821 latent NameErrors
        # included). Pinned major so a ruff release adding rules cannot
        # break main without a deliberate bump.
        run: |
          python -m pip install "ruff>=0.4,<0.15"
          ruff check mcp_proxy cullis_sdk scripts test

  pytest:
    name: Core unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install core + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_proxy/requirements-proxy.txt
          pip install -e ".[dev]"
      - name: Run core test suite
        # Mirrors the documented local gate (pytest -n auto --dist=loadfile).
        # This job is the regression net that was missing while the
        # mcp_proxy test coverage lived only in cullis-enterprise behind a
        # stale .core-ref. Postgres-marked tests skip without
        # CULLIS_TEST_PG_URL; everything else runs on SQLite.
        run: |
          python -m pytest test/unit test/integration -n auto --dist=loadfile -q

  metadata:
    name: Repo metadata sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required top-level files exist
        run: |
          set -e
          for f in README.md LICENSE LICENSE-APACHE-2.0 NOTICE SECURITY.md CONTRIBUTING.md CHANGELOG.md pyproject.toml; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: No tracked maintainer-internal notes
        run: |
          if git ls-files imp/ | grep -q .; then
            echo "imp/ contains tracked files — should be local-only per .gitignore"
            git ls-files imp/
            exit 1
          fi

  smoke:
    name: Authorization and audit smoke (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run full smoke with real agent credentials
        env:
          SMOKE_TEST_BACKEND: ${{ matrix.backend }}
        run: |
          args=()
          if [ "$SMOKE_TEST_BACKEND" = postgres ]; then args+=(--pg); fi
          bash test/smoke/smoke.sh "${args[@]}" --json "$RUNNER_TEMP/smoke-results.json"
      - name: Upload verdicts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-verdicts-${{ matrix.backend }}
          path: ${{ runner.temp }}/smoke-results.json
          # State snapshots contain test credentials; do not publish them.
